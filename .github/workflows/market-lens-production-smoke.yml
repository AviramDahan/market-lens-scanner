name: Market Lens Production Smoke

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Deployed image revision to verify after a release
        required: false
        type: string
  workflow_run:
    workflows: ["Market Lens Source QA"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: market-lens-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip render]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke dependency
        run: python -m pip install "openpyxl>=3.1.5"

      - name: Run read-only production smoke
        env:
          MARKET_LENS_SMOKE_URL: https://market-lens.2.28.100.77.sslip.io
          MARKET_LENS_SMOKE_DEPLOYMENT_MODE: host
          MARKET_LENS_SMOKE_TICKER: MSFT
          # Automatic runs check host health; releases pass their image revision.
          MARKET_LENS_SMOKE_EXPECTED_REVISION: ${{ inputs.expected_revision || '' }}
          MARKET_LENS_SMOKE_DEPLOY_WAIT_SECONDS: "360"
          MARKET_LENS_SMOKE_MONITOR_MAX_AGE_MINUTES: "3"
          MARKET_LENS_SMOKE_MONITOR_WAIT_SECONDS: "120"
          MARKET_LENS_SMOKE_REPORT_PATH: production-smoke-report.json
        run: python agent/production_smoke.py

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-lens-production-smoke-${{ github.run_id }}
          path: production-smoke-report.json
          if-no-files-found: warn
          retention-days: 14
