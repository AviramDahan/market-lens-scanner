name: One-time Market Lens secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt-for-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Encrypt existing paper-agent secrets to the Hetzner recipient
        env:
          MARKET_LENS_EMAIL: ${{ secrets.MARKET_LENS_EMAIL }}
          MARKET_LENS_PASSWORD: ${{ secrets.MARKET_LENS_PASSWORD }}
          MARKET_LENS_TELEGRAM_BOT_TOKEN: ${{ secrets.MARKET_LENS_TELEGRAM_BOT_TOKEN }}
          MARKET_LENS_TELEGRAM_CHAT_ID: ${{ secrets.MARKET_LENS_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/market-lens-migration-plain.json' EXIT
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          names = (
              "MARKET_LENS_EMAIL",
              "MARKET_LENS_PASSWORD",
              "MARKET_LENS_TELEGRAM_BOT_TOKEN",
              "MARKET_LENS_TELEGRAM_CHAT_ID",
          )
          missing = [name for name in names if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing GitHub secret names: " + ", ".join(missing))
          Path("/tmp/market-lens-migration-plain.json").write_text(
              json.dumps({name: os.environ[name] for name in names}),
              encoding="utf-8",
          )
          PY
          openssl cms -encrypt -binary -aes256 \
            -in /tmp/market-lens-migration-plain.json \
            -out market-lens-migration-secrets.cms -outform DER \
            deploy/hetzner/migration-recipient.crt
      - uses: actions/upload-artifact@v4
        with:
          name: market-lens-migration-secrets
          path: market-lens-migration-secrets.cms
          retention-days: 1
          if-no-files-found: error
