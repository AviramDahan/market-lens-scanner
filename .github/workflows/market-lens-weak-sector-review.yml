name: Market Lens Weak Sector Review Reminder

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC is 10:00 Asia/Jerusalem on 2026-10-13.
    # Daily retries cover a delayed/failed scheduled run without market-hour guards.
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: market-lens-repo-writes
  cancel-in-progress: false

jobs:
  send-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Check due time and persisted delivery receipt
        id: preflight
        shell: bash
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-10-13 07:00:00 UTC' +%s)" ]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if git show origin/main:agent_results/telegram_notifications.jsonl 2>/dev/null \
            | grep -Fq 'weak-sector-override-v1-review-2026-10-13-1000-asia-jerusalem'; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.preflight.outputs.should_send == 'true'
        with:
          python-version: "3.12"
      - name: Install project dependencies
        if: steps.preflight.outputs.should_send == 'true'
        run: python -m pip install -e .
      - name: Deliver the due review or a reporting failure notice
        if: steps.preflight.outputs.should_send == 'true'
        env:
          MARKET_LENS_TELEGRAM_BOT_TOKEN: ${{ secrets.MARKET_LENS_TELEGRAM_BOT_TOKEN }}
          MARKET_LENS_TELEGRAM_CHAT_ID: ${{ secrets.MARKET_LENS_TELEGRAM_CHAT_ID }}
          MARKET_LENS_TELEGRAM_REVIEW_THREAD_ID: ${{ secrets.MARKET_LENS_TELEGRAM_REVIEW_THREAD_ID }}
        run: python -m agent.send_weak_sector_review
