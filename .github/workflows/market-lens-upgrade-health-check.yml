name: Market Lens Upgrade Health Check

on:
  workflow_dispatch:
  schedule:
    # Early, midday, and end-of-day New York checks during EDT.
    # Scanner timing still lives in /agent/trigger-scan.
    - cron: "20 14 * * 1-5"
    - cron: "40 17 * * 1-5"
    - cron: "30 20 * * 1-5"

permissions:
  contents: read
  actions: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check production health after scan-size upgrade
        id: production_health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_LENS_PUBLIC_URL: https://market-lens-scanner-fb63.onrender.com
          MARKET_LENS_HEALTH_SCAN_WORKFLOW: market-lens-agent.yml
          MARKET_LENS_HEALTH_MAX_SCAN_AGE_MINUTES: "240"
          MARKET_LENS_HEALTH_MIN_RESULT_CARDS: "120"
          MARKET_LENS_HEALTH_MAX_RUNTIME_SECONDS: "1260"
          MARKET_LENS_HEALTH_MAX_TRACKER_BYTES: "75000000"
          MARKET_LENS_HEALTH_TELEGRAM_ENABLED: "false"
          MARKET_LENS_HEALTH_NOTIFY_SUCCESS: "false"
        run: python agent/health_check.py

      - name: Dispatch cloud recovery scan
        if: steps.production_health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCAN_WORKFLOW: market-lens-agent.yml
        shell: bash
        run: |
          active_runs="$(
            gh run list \
              --repo "$GH_REPO" \
              --workflow "$SCAN_WORKFLOW" \
              --limit 10 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          if [ "${active_runs:-0}" -gt 0 ]; then
            echo "A scan is already queued or running; recovery dispatch is not needed."
            exit 0
          fi

          gh workflow run "$SCAN_WORKFLOW" --repo "$GH_REPO" --ref main -f force=true
          echo "Dispatched a forced cloud recovery scan."

      - name: Report health failure after recovery dispatch
        if: steps.production_health.outcome == 'failure'
        run: |
          echo "Production health failed. Recovery was dispatched or an active scan was already running."
          exit 1
