services:
  - type: web
    name: market-lens-scanner
    env: docker
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: MARKET_LENS_RENDER_SHADOW_MONITOR_ENABLED
        value: "true"
      - key: MARKET_LENS_RENDER_SHADOW_MONITOR_INTERVAL_SECONDS
        value: "60"
      - key: MARKET_LENS_RENDER_SHADOW_MONITOR_STARTUP_DELAY_SECONDS
        value: "20"
      - key: MARKET_LENS_RENDER_SHADOW_MONITOR_TIMEOUT_SECONDS
        value: "45"
      - key: MARKET_LENS_RENDER_SHADOW_MONITOR_REGULAR_SESSION_ONLY
        value: "true"
